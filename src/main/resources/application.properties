spring.application.name=artic-hr

# Datos: Flyway crea el esquema y Hibernate solo lo valida
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Desarrollo local: Docker Compose solo se activa con el perfil local
spring.docker.compose.enabled=false

# Sesión en servidor con Spring Session JDBC (DERCAS 9.2 y RNF-02)
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Caddy termina HTTPS y reenvía la IP real en X-Forwarded-For
server.forward-headers-strategy=native

# Nunca exponer detalles internos en errores
server.error.include-message=never
server.error.include-stacktrace=never

# Swagger UI y OpenAPI: apagados por defecto, para no publicar el mapa de la API en producción.
# El perfil local y spring-boot:test-run los encienden.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.paths-to-match=/api/**
# Swagger UI copia la cookie XSRF-TOKEN al encabezado X-XSRF-TOKEN, igual que Angular
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true

# Reglas del login (DERCAS RNF-01, RNF-02 y 9.3)
artichr.sesion.duracion-maxima=8h
artichr.login.max-intentos=5
artichr.login.duracion-bloqueo=15m
artichr.login.limite-ip.max-fallos=20
artichr.login.limite-ip.ventana=15m
